<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Web Page</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 480px);
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(79, 70, 229, 0.12);
        padding: 32px 28px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        background: #eef2ff;
        color: var(--primary-dark);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 8px 12px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2.2rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 1rem;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      nav {
        margin-bottom: 24px;
      }

      .btn {
        text-decoration: none;
        border: none;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-secondary {
        background: #e5e7eb;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Welcome</div>
      <h1>Hello, world!</h1>
      <p>
        This is a simple HTML page with a clean layout, soft colors, and a
        minimal design.
      </p>

      <div class="actions">
        <a href="#" class="btn btn-primary">Get Started</a>
        <a href="about-us.html" class="btn btn-secondary">About Us</a>
      </div>
    </main>
  </body>
</html>
